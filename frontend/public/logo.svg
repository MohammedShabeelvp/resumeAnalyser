<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    x="20"
    y="20"
    width="472"
    height="472"
    rx="90"
    fill="url(#bg)"
  />

  <!-- Document -->
  <g filter="url(#shadow)">
    <rect
      x="140"
      y="105"
      width="165"
      height="230"
      rx="18"
      fill="#FFFFFF"
    />

    <rect x="140" y="105" width="165" height="46" rx="18" fill="#E8F5E9"/>

    <rect x="165" y="175" width="80" height="10" rx="5" fill="#22C55E"/>
    <rect x="165" y="200" width="110" height="8" rx="4" fill="#A7F3D0"/>
    <rect x="165" y="220" width="95" height="8" rx="4" fill="#A7F3D0"/>

    <rect x="165" y="255" width="80" height="10" rx="5" fill="#22C55E"/>
    <rect x="165" y="280" width="110" height="8" rx="4" fill="#A7F3D0"/>
    <rect x="165" y="300" width="95" height="8" rx="4" fill="#A7F3D0"/>
  </g>

  <!-- Magnifying Glass -->
  <circle
    cx="305"
    cy="300"
    r="78"
    fill="#F8FAFC"
    stroke="#FFFFFF"
    stroke-width="14"
    filter="url(#shadow)"
  />

  <line
    x1="360"
    y1="355"
    x2="415"
    y2="410"
    stroke="#FFFFFF"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Check -->
  <path
    d="M275 300 L295 320 L340 275"
    fill="none"
    stroke="#22C55E"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Star Badge -->
  <circle
    cx="372"
    cy="135"
    r="22"
    fill="#FBBF24"
  />

  <path
    d="M372 121
       L376 131
       L387 132
       L379 139
       L381 150
       L372 145
       L363 150
       L365 139
       L357 132
       L368 131Z"
    fill="#FFFFFF"
  />
</svg>